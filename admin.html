<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin - Bharat Medical Store</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #087f5b;
        }

        .form-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .form-box h2 {
            color: #087f5b;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            background: #087f5b;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #065f46;
        }

        .medicine-list {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .medicine-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .medicine-card h3 {
            color: #087f5b;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #087f5b;
            font-weight: bold;
        }

    </style>

</head>


<body>

<div class="container">

    <a href="/" class="back">
        ← Back to Website
    </a>


    <h1>
        Bharat Medical Store - Admin Panel
    </h1>


    <!-- ADD MEDICINE -->

    <div class="form-box">

        <h2>
            Add New Medicine
        </h2>

        <form
            action="/add-medicine"
            method="POST"
        >

            <input
                type="text"
                name="name"
                placeholder="Medicine Name"
                required
            >

            <input
                type="text"
                name="description"
                placeholder="Description"
                required
            >

            <input
                type="number"
                name="price"
                placeholder="Price"
                step="0.01"
                required
            >

            <input
                type="number"
                name="stock"
                placeholder="Stock"
                required
            >

            <button type="submit">
                ➕ Add Medicine
            </button>

        </form>

    </div>


    <!-- EXISTING MEDICINES -->

    <div class="form-box">

        <h2>
            Existing Medicines
        </h2>


        <div class="medicine-list">

            {% for medicine in medicines %}

            <div class="medicine-card">

                <h3>
                    {{ medicine.name }}
                </h3>

                <p>
                    {{ medicine.description }}
                </p>

                <p>
                    <strong>
                        Price:
                    </strong>
                    ₹{{ medicine.price }}
                </p>

                <p>
                    <strong>
                        Stock:
                    </strong>
                    {{ medicine.stock }}
                </p>

            </div>

            {% endfor %}

        </div>

    </div>

</div>

</body>

</html>
